[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "secretariat"
version = "0.7.0"
description = "Credential index, reconciliation tool, and password-store bridge"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
kdbx = ["pykeepass>=4.2.0"]

[project.scripts]
secretariat = "secretariat.app:main"
secretariat-native-host = "secretariat.native_host:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
