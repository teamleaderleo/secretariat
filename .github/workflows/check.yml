name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests scripts/secretariat
      - name: Browser extension syntax
        run: |
          python -m json.tool browser/extension/manifest.json >/dev/null
          node --check browser/extension/service_worker.js
          node --check browser/extension/popup.js
      - name: Secret audit
        run: PYTHONPATH=src python -m secretariat audit
      - name: Diff check
        run: git diff --check

  kdbx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install KDBX extra
        run: python -m pip install -e '.[kdbx]'
      - name: KDBX tests
        run: python -m unittest discover -s tests -v
