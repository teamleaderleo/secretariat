name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests scripts/secretariat
      - name: Secret audit
        run: PYTHONPATH=src python -m secretariat audit
      - name: Diff check
        run: git diff --check
